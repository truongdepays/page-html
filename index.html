:"Gỗ Hố Nai","tom_tat":"","trang":[],"khu_vuc":"Sản xuất","linkedin_url":null,"looked_up":true},{"ho_ten":"Vũ Minh Tuấn","chuc_vu":"CEO","don_vi":"Gỗ Nam Định","tom_tat":"","trang":[],"khu_vuc":"Sản xuất","linkedin_url":null,"looked_up":true}];

    // Normalize Vietnamese for accent-insensitive search
    function norm(s) {
      if (!s) return '';
      return String(s).toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd').replace(/Đ/g, 'd');
    }

    let currentFilter = 'all';
    let currentRegion = 'all';
    let currentSearch = '';

    function highlight(text, query) {
      if (!query) return escHtml(text);
      const nText = norm(text);
      const nQuery = norm(query);
      const idx = nText.indexOf(nQuery);
      if (idx === -1) return escHtml(text);
      return escHtml(text.slice(0, idx)) +
        '<mark>' + escHtml(text.slice(idx, idx + query.length)) + '</mark>' +
        escHtml(text.slice(idx + query.length));
    }

    function escHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function render() {
      const q = norm(currentSearch.trim());
      const rows = DATA.filter(r => {
        // Status filter
        if (currentFilter === 'found' && !r.linkedin_url) return false;
        if (currentFilter === 'missing' && (r.linkedin_url || !r.looked_up)) return false;
        if (currentFilter === 'pending' && r.looked_up) return false;
        
        // Region filter
        if (currentRegion !== 'all' && r.khu_vuc !== currentRegion) return false;

        // search
        if (q) {
          const haystack = norm(r.ho_ten + ' ' + (r.chuc_vu||'') + ' ' + r.don_vi + ' ' + (r.khu_vuc||''));
          if (!haystack.includes(q)) return false;
        }
        return true;
      });

      const tbody = document.getElementById('tbody');
      const empty = document.getElementById('empty');
      const count = document.getElementById('count');

      count.textContent = rows.length + ' / ' + DATA.length + ' người';

      if (rows.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = '';
        return;
      }
      empty.style.display = 'none';

      const q_raw = currentSearch.trim();
      tbody.innerHTML = rows.map((r, i) => {
        let liCell;
        if (r.linkedin_url) {
          liCell = `<span class="badge found">Có</span><br><a class="li-link" href="${escHtml(r.linkedin_url)}" target="_blank" rel="noopener">${escHtml(r.linkedin_url.replace('https://www.linkedin.com/in/',''))}</a>`;
        } else if (!r.looked_up) {
          liCell = `<span class="badge pending">Chưa tra cứu</span>`;
        } else {
          liCell = `<span class="badge missing">Không tìm thấy</span>`;
        }

        let tomTatCell = '';
        if (r.tom_tat) {
          const id = `tt-${i}`;
          tomTatCell = `<div class="tom-tat"><button class="tom-tat-toggle" onclick="toggleTomTat('${id}', this)">▶ Xem tóm tắt</button><div class="tom-tat-text" id="${id}">${escHtml(r.tom_tat)}</div></div>`;
        }

        const regionHtml = r.khu_vuc ? `<div class="region">${highlight(r.khu_vuc, q_raw)}</div>` : '';

        return `<tr>
          <td>${i + 1}</td>
          <td>
            <div class="name">${highlight(r.ho_ten, q_raw)}</div>
            <div class="title">${highlight(r.chuc_vu || '', q_raw)}</div>
          </td>
          <td class="org">
            <div>${highlight(r.don_vi, q_raw)}</div>
            ${regionHtml}
          </td>
          <td>${tomTatCell}</td>
          <td>${liCell}</td>
        </tr>`;
      }).join('');
    }

    function toggleTomTat(id, btn) {
      const el = document.getElementById(id);
      const open = el.classList.toggle('open');
      btn.textContent = open ? '▼ Ẩn tóm tắt' : '▶ Xem tóm tắt';
    }

    // Search
    document.getElementById('search').addEventListener('input', e => {
      currentSearch = e.target.value;
      render();
    });

    // Filters
    document.querySelectorAll('.filters button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    // Region Filter
    document.getElementById('region-filter').addEventListener('change', e => {
      currentRegion = e.target.value;
      render();
    });

    render();
  </script>
